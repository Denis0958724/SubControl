# Test build for Android phones: an .apk you can install without Google Play.
# Pro switches on for free in this build. Store builds go through EAS (see README).
name: Тестовий APK для Android

on:
  workflow_dispatch:
  # a fresh test APK after every change to the app on main
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-test-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-test-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_TEST_PRO: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Checks
        run: |
          npm run typecheck
          npm test

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          printf "\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n" >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee build.log

      - name: Show why the build failed
        if: failure()
        run: |
          [ -f android/build.log ] || exit 0
          REASON=$(grep -E -A12 "What went wrong|error:|ERROR|Error:" android/build.log | grep -v "^\s*$" | head -60)
          [ -n "$REASON" ] || REASON=$(tail -n 60 android/build.log)
          echo "::error title=Gradle::$(echo "$REASON" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk SubControl-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SubControl-test-apk
          path: SubControl-test.apk
          retention-days: 30

      # One release with a permanent link:
      # https://github.com/<owner>/<repo>/releases/download/android-test/SubControl-test.apk
      - name: Put the APK on the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NOTES="Тестова збірка SubControl $VERSION для Android, номер ${{ github.run_number }}.

          Як встановити:
          1. Відкрийте цю сторінку з телефона.
          2. Нижче, у розділі Assets, натисніть SubControl-test.apk.
          3. Відкрийте завантажений файл. Android попросить дозволити встановлення з браузера. Це нормально для застосунків не з Google Play.

          У тестовій збірці Pro вмикається безкоштовно. Посилання постійне, файл оновлюється з кожною збіркою."
          # older numbered test releases are replaced by this one
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName | select(startswith("test-"))'); do
            gh release delete "$tag" --cleanup-tag --yes || true
          done
          if gh release view android-test >/dev/null 2>&1; then
            gh release upload android-test SubControl-test.apk --clobber
            gh release edit android-test --notes "$NOTES" --title "SubControl для Android (тестова збірка)" --latest
          else
            gh release create android-test SubControl-test.apk \
              --title "SubControl для Android (тестова збірка)" \
              --notes "$NOTES" \
              --target "${{ github.sha }}" \
              --latest
          fi
